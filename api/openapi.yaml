openapi: 3.0.3
info:
  title: Business Process Automation Lab API
  version: 1.0.0
  description: >
    Contrato HTTP consumido pelos fluxos low-code (n8n importável e receita Power Automate).
    Núcleo de regras roda só com stdlib; o serviço requer fastapi/uvicorn.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness do serviço
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /automate/validate:
    post:
      summary: Valida um documento sintético aplicando as regras de conferência
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: resultado da validação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "422":
          description: payload inválido
  /automate/batch:
    post:
      summary: Valida uma lista de documentos e devolve o resumo (taxa de automação)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documents:
                  type: array
                  items: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: resumo do lote
  /process/kpis:
    get:
      summary: KPIs do process mining gerados por `make mining`
      responses:
        "200":
          description: relatório de mineração
        "404":
          description: pipeline ainda não executado
components:
  schemas:
    Document:
      type: object
      required: [document_number, cnpj, amount, issued_at, due_date]
      properties:
        document_number: { type: string, example: NF-10231 }
        cnpj: { type: string, example: "11222333000181" }
        amount: { oneOf: [{ type: string }, { type: number }], example: "1.234,56" }
        expected_amount: { oneOf: [{ type: string }, { type: number }, { type: "null" }] }
        issued_at: { type: string, example: "2026-06-01" }
        due_date: { type: string, example: "2026-06-30" }
    ValidationResult:
      type: object
      properties:
        status: { type: string, example: revisao_humana }
        needs_human_review: { type: boolean }
        divergences:
          type: array
          items:
            type: object
            properties:
              rule: { type: string, example: valor_divergente }
              delta: { type: number, example: 234.56 }
        normalized:
          type: object
          additionalProperties: true
