name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: núcleo (só stdlib) — nenhum teste pulado na parte de processo
        run: python -m unittest discover -s tests -t .
      - name: extras da API instalados — cobre também os testes de API
        run: |
          python -m pip install --quiet "fastapi==0.115.6" "uvicorn==0.34.0" "pydantic==2.10.4" "httpx==0.28.1"
          python -m unittest discover -s tests -t .
      - name: pipeline reprodutível (2 execuções, bytes idênticos)
        run: python scripts/check_reproducibility.py
      - name: artefatos commitados batem com o pipeline
        run: |
          git diff --exit-code -- data reports bpmn dashboard \
            || (echo "::error::rode 'make all' e commite os artefatos"; exit 1)
